name: 公告通知 Discord

on:
  push:
    branches: [main]
    paths: [announcements.json]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 比對新公告並發送通知
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          git show HEAD~1:announcements.json > /tmp/old_announcements.json 2>/dev/null || echo '{"announcements":[]}' > /tmp/old_announcements.json

          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          webhook_url = os.environ.get("DISCORD_WEBHOOK")
          if not webhook_url:
              print("⚠️  DISCORD_WEBHOOK 未設定，跳過通知")
              exit(0)

          with open("/tmp/old_announcements.json", "r") as f:
              old_data = json.load(f)
          with open("announcements.json", "r") as f:
              new_data = json.load(f)

          old_ids = {a["id"] for a in old_data.get("announcements", [])}
          new_anns = [a for a in new_data.get("announcements", []) if a["id"] not in old_ids]

          if not new_anns:
              print("沒有新公告")
              exit(0)

          print(f"找到 {len(new_anns)} 則新公告")

          tag_colors = {
              "公告": 0x578aff,
              "更新": 0x64dcb4,
              "活動": 0xffaa32,
              "維護": 0xff8282,
              "修復": 0xab72f9,
          }

          for ann in new_anns:
              tag = ann.get("tag", "公告")
              color = tag_colors.get(tag, 0x578aff)
              title = ann.get("title", "無標題")
              ann_id = ann.get("id", "")
              date = ann.get("date", "")
              content = ann.get("content", "")

              if len(content) > 1000:
                  content = content[:1000] + "…"

              embed = {
                  "title": f"{ann_id} {title}",
                  "description": content,
                  "color": color,
                  "footer": {"text": f"海風公告 · {tag} · {date}"},
              }

              images = ann.get("images", [])
              if images:
                  embed["image"] = {"url": images[0]}

              payload = {"embeds": [embed]}

              req = urllib.request.Request(
                  webhook_url,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  resp = urllib.request.urlopen(req)
                  print(f"✅ 已發送: {ann_id} {title} (HTTP {resp.status})")
              except urllib.error.HTTPError as e:
                  print(f"❌ 發送失敗: {ann_id} {title} (HTTP {e.code})")
                  print(e.read().decode())

          print(f"完成，共發送 {len(new_anns)} 則")
          PYEOF
